name: Verify public guide

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synthetic configs, docs and redaction
        run: node tests/verify.cjs
      - name: Check fixed-egress relay failover template
        run: node --test tests/fixed-egress-failover.test.cjs
